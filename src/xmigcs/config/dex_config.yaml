    - "hip_roll_r_joint"
    - "hip_yaw_r_joint"
    - "knee_pitch_r_joint"
    - "ankle_pitch_r_joint"
    - "ankle_roll_r_joint"
    - "waist_yaw_joint"
    - "waist_roll_joint"
    - "waist_pitch_joint"
    - "shoulder_pitch_l_joint"
    - "shoulder_roll_l_joint"
    - "shoulder_yaw_l_joint"
    - "elbow_pitch_l_joint"
    - "elbow_yaw_l_joint"
    - "wrist_pitch_l_joint"
    - "wrist_roll_l_joint"
    - "shoulder_pitch_r_joint"
    - "shoulder_roll_r_joint"
    - "shoulder_yaw_r_joint"
    - "elbow_pitch_r_joint"
    - "elbow_yaw_r_joint"
    - "wrist_pitch_r_joint"
    - "wrist_roll_r_joint"
  head:
