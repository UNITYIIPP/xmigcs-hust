model_path: "policy_rough0925.onnx"

motor_num: 31
actions_size: 23
dt: 0.01

control:
  decimation: 2

normalization:
  clip_scales:
    clip_observations: 100.0
    clip_actions: 100.0
  obs_scales:
    lin_vel: 1.0
    ang_vel: 1.0
    dof_pos: 1.0
    dof_vel: 1.0

size:
  # Fallback only. Static ONNX input shape and observation metadata take precedence.
  num_hist: 1
  observations_size: 78

# Used to reconstruct waist_pitch_link uprightness for the optional amp_condition term.
# Angular velocity and projected gravity remain in the root (pelvis/IMU) frame.
# Waist joint indices in the 31-DOF mj joint order
anchor:
  waist_yaw_idx: 12
  waist_roll_idx: 13
  waist_pitch_idx: 14

# 策略不控制但需要锁位 / 设置 PD 增益的关节
fixed_joints:
  - name: "wrist_pitch_l_joint"
    target_pos: 0.0
    kp: 20.0
    kd: 1.4
  - name: "wrist_roll_l_joint"
    target_pos: 0.0
    kp: 20.0
    kd: 1.4
  - name: "elbow_yaw_l_joint"
    target_pos: 0.0
    kp: 20.0
    kd: 1.4
  - name: "wrist_pitch_r_joint"
    target_pos: 0.0
    kp: 20.0
    kd: 1.4
  - name: "wrist_roll_r_joint"
    target_pos: 0.0
    kp: 20.0
    kd: 1.4
  - name: "elbow_yaw_r_joint"
    target_pos: 0.0
    kp: 20.0
    kd: 1.4
  - name: "head_pitch_joint"
    target_pos: 0.0
    kp: 0.0
    kd: 0.0
  - name: "head_yaw_joint"
    target_pos: 0.0
    kp: 0.0
    kd: 0.0
